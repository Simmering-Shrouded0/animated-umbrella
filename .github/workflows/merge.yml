name: Auto-Merge Domain Lists
on:
  schedule:
    - cron: '15 1 * * *' # Runs at 1:15 AM UTC
  workflow_dispatch: # Allows you to click a button to run it manually

permissions:
  contents: write # Allows the bot to save the combined file

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download and Combine Lists
        run: |
          # 1. Initialize our tracking files
          > raw-domains.txt
          > processed.txt
          cp companies.txt pending.txt

          # 2. Process the queue until it is completely empty
          while [ -s pending.txt ]; do
            
            # Grab the top company from the pending list (and strip hidden Windows line breaks)
            company=$(head -n 1 pending.txt | tr -d '\r')
            
            # Remove that top company from the pending list
            tail -n +2 pending.txt > temp.txt && mv temp.txt pending.txt

            # Skip if it is empty, a comment, or we have already processed it
            if [[ -z "$company" || "$company" == \#* ]] || grep -Fxq -- "$company" processed.txt; then
              continue
            fi

            echo "Downloading and parsing: $company"
            
            # Mark as processed so we don't download it twice
            echo "$company" >> processed.txt

            # Download content with automatic error retry and silent failure flags
            if ! content=$(curl -f -sS --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 120 "https://raw.githubusercontent.com/v2fly/domain-list-community/refs/heads/master/data/$company"); then
              echo "::error::Failed to download $company; keeping the existing master-list.txt"
              exit 1
            fi

            # Check for 'include:' tags and add those new lists to the bottom of the pending queue
            printf '%s\n' "$content" | awk '
              {
                sub(/#.*/, "")
                if ($1 ~ /^include:/) {
                  if (NF > 1) {
                    print "Filtered includes require attribute-aware parsing: " $0 > "/dev/stderr"
                    exit 1
                  }
                  sub(/^include:/, "", $1)
                  print $1
                }
              }
            ' >> pending.txt

            # Keep literal domains only; regex and keyword rules are not router domains.
            printf '%s\n' "$content" | awk '
              {
                sub(/#.*/, "")
                if (NF == 0) next
                entry = $1
                if (entry ~ /^(include:|keyword:|regexp:)/) next
                sub(/^(full:|domain:)/, "", entry)
                print entry
              }
            ' >> raw-domains.txt
            
            # Be polite to the API: pause for 1.5 seconds before moving to the next list
            sleep 1.5
            
          done

          # 3. Combine custom entries before filtering and deduplication.
          if [ -f my-custom-domains.txt ]; then
            cat my-custom-domains.txt >> raw-domains.txt
          fi

          # Require at least two non-empty labels, e.g. example.com.
          # This excludes upstream TLD rules such as google and youtube.
          awk '
            {
              sub(/\r$/, "")
              sub(/#.*/, "")
              if (NF == 0) next
              entry = $1
              if (entry ~ /^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$/) print entry
            }
          ' raw-domains.txt | LC_ALL=C sort -u > master-list.tmp

          if [ ! -s master-list.tmp ]; then
            echo "::error::No router-compatible domains found; keeping the existing master-list.txt"
            exit 1
          fi
          mv master-list.tmp master-list.txt

      - name: Save the Master File to Repository
        run: |
          git config --global user.name "Auto-Merger Bot"
          git config --global user.email "bot@github.com"
          git add master-list.txt
          # Only commit if the upstream lists actually changed
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated update of combined list"
          git push
